[package]
name         = "signal-agent"
version      = "0.3.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-agent"
description  = "Ordinary Signal contract for the agent LLM-call component."
publish      = false
links        = "signal-agent"
build        = "build.rs"

[lib]
name = "signal_agent"
path = "src/lib.rs"

[features]
default = ["dotos-text"]
dotos-text = ["dep:dotos", "signal-frame/dotos-text"]

[[test]]
name = "round_trip"
path = "tests/round_trip.rs"
required-features = ["dotos-text"]

[dependencies]
dotos         = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3", optional = true }
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "ca72b2d1151f", default-features = false }
thiserror    = "2"

[build-dependencies]
protos = { git = "https://github.com/LiGoldragon/protos.git", rev = "9bce5ed8efadeb157811b256aa69a1f88cd5314f" }
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", rev = "6179a7cf1394083244dd3f3e1d2709f9ec08f7db" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
